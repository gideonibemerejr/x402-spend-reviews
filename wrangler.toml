name = "x402-spend-reviews"
main = "src/index.ts"

# Stated rather than defaulted. Preview URLs would publish every version at its
# own public address against this same production D1, so an unfinished version
# would stay callable after being deployed past.
workers_dev = true
preview_urls = false
# Newest date the whole toolchain accepts: the vitest pool's bundled workerd
# supports up to 2026-08-22, older than wrangler's own. Raise this once the pool
# ships a newer runtime.
compatibility_date = "2026-08-22"

# The stable origin the site calls. Added as a custom domain rather than a
# route so Cloudflare provisions the DNS record and certificate itself.
# workers_dev stays on above: the existing *.workers.dev URL is published and
# must keep answering.
[[routes]]
pattern = "api.x402spend.dev"
custom_domain = true

# Traces need their own flag; the top-level setting alone does not enable them.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# Secrets only, never keys in this file:
#   wrangler secret put RPC_URL_8453             # Base
#   wrangler secret put RPC_URL_84532            # Base Sepolia
#   wrangler secret put RPC_URL_43114            # Avalanche
#   wrangler secret put RPC_URL_43113            # Avalanche Fuji
#   wrangler secret put RPC_URL_42161            # Arbitrum One
#   wrangler secret put RPC_URL_56               # BNB Smart Chain
#   wrangler secret put RPC_URL_SOLANA
#   wrangler secret put RPC_URL_SOLANA_DEVNET
#   wrangler secret put ADMIN_TOKEN
# The Solana endpoints are optional; without them the public cluster endpoints
# are used, which throttle hard enough to park reviews as pending under load.

[[d1_databases]]
binding = "DB"
database_name = "x402-spend-reviews"
database_id = "f493dbb4-ff0b-4f05-929a-e5e464d35164"
migrations_dir = "migrations"

# period must be 10 or 60; anything else is rejected by the platform.
[[ratelimits]]
name = "POST_REVIEWS"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "GET_REVIEWS"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

# The two demo routes. Tighter than the read side by an order of magnitude
# because each call costs either an RPC round trip or an outbound fetch to a
# stranger's server, and both are unauthenticated: without a limit here the
# demos are a way to spend this Worker's budget, and the probe a way to point
# it at someone else.
[[ratelimits]]
name = "DEMO"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# Drains pending verifications; retryPending is also reachable at POST /internal/retry.
[triggers]
crons = ["*/5 * * * *"]
